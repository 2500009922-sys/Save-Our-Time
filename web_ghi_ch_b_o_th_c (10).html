<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghi Chú & Trợ Lý Thời Gian</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        /* Custom scrollbar for note list */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1; 
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
        /* Notification animation */
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .notification-anim {
            animation: slideIn 0.3s ease-out forwards;
        }
    </style>
</head>
<body class="h-screen w-full flex flex-col md:flex-row overflow-hidden text-slate-800">

    <!-- Sidebar: Time & Alarm -->
    <aside class="w-full md:w-80 bg-white border-r border-slate-200 flex flex-col h-1/3 md:h-full shadow-sm z-10">
        <div class="p-5 border-b border-slate-100 flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-xl shadow-inner">
                <i class="fa-solid fa-clock"></i>
            </div>
            <h1 class="font-bold text-xl text-slate-800">Trợ Lý Thời Gian</h1>
        </div>

        <div class="flex-1 overflow-y-auto p-5 space-y-6 custom-scrollbar">
            <!-- Current Time -->
            <div class="bg-slate-50 p-4 rounded-xl border border-slate-100 text-center shadow-sm">
                <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Giờ hiện tại</p>
                <div id="current-time" class="text-3xl font-bold text-slate-700 font-mono tracking-tight">00:00:00</div>
            </div>

            <!-- Timer Section -->
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                <h2 class="font-semibold text-slate-700 mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-hourglass-half text-orange-500"></i> Đếm ngược
                </h2>
                
                <!-- Timer Display -->
                <div id="timer-display" class="text-4xl font-bold text-center text-slate-800 mb-4 font-mono py-2 bg-slate-50 rounded-lg border border-slate-100 hidden">
                    00:00
                </div>

                <!-- Timer Inputs -->
                <div id="timer-inputs" class="flex gap-2 mb-4">
                    <div class="flex-1">
                        <label class="text-xs text-slate-500 mb-1 block">Phút</label>
                        <input type="number" id="timer-min" min="0" max="999" value="5" class="w-full p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-center font-mono">
                    </div>
                    <div class="flex-1">
                        <label class="text-xs text-slate-500 mb-1 block">Giây</label>
                        <input type="number" id="timer-sec" min="0" max="59" value="0" class="w-full p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-center font-mono">
                    </div>
                </div>

                <div class="flex gap-2">
                    <button id="btn-start-timer" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg transition-colors font-medium text-sm flex justify-center items-center gap-2">
                        <i class="fa-solid fa-play"></i> Bắt đầu
                    </button>
                    <button id="btn-stop-timer" class="hidden flex-1 bg-red-500 hover:bg-red-600 text-white py-2 rounded-lg transition-colors font-medium text-sm flex justify-center items-center gap-2">
                        <i class="fa-solid fa-stop"></i> Dừng
                    </button>
                    <button id="btn-reset-timer" class="w-10 bg-slate-200 hover:bg-slate-300 text-slate-700 py-2 rounded-lg transition-colors flex justify-center items-center">
                        <i class="fa-solid fa-rotate-right"></i>
                    </button>
                </div>
            </div>

            <!-- Reminder Section -->
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                <h2 class="font-semibold text-slate-700 mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-thumbtack text-rose-500"></i> Nhắc nhở
                </h2>
                
                <div class="mb-3 space-y-2">
                    <input type="text" id="reminder-text" placeholder="Nội dung (vd: Uống nước, Họp...)" class="w-full p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm">
                    <input type="time" id="reminder-time" class="w-full p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-center font-mono text-sm cursor-pointer hover:bg-slate-50 transition-colors">
                </div>
                
                <button id="btn-set-reminder" class="w-full bg-slate-800 hover:bg-slate-900 text-white py-2 rounded-lg transition-colors font-medium text-sm mb-3">
                    Tạo nhắc nhở
                </button>

                <div id="active-reminders-list" class="space-y-2">
                    <!-- Reminders will be injected here -->
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Content: Notes -->
    <main class="flex-1 flex flex-col h-2/3 md:h-full bg-slate-50 relative">
        <!-- Header -->
        <header class="bg-white px-6 py-4 border-b border-slate-200 flex justify-between items-center shadow-sm z-10">
            <div class="flex items-center gap-4">
                <h2 class="text-2xl font-bold text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-book-bookmark text-blue-500"></i> Sổ Tay Ghi Chú
                </h2>
            </div>
            <div class="flex items-center gap-3">
                <button id="btn-new-note" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2.5 rounded-lg transition-colors font-medium text-sm flex items-center gap-2 shadow-sm">
                    <i class="fa-solid fa-plus"></i> Tạo mới
                </button>
            </div>
        </header>

        <!-- Notes Area -->
        <div class="flex-1 flex flex-col md:flex-row overflow-hidden">
            <!-- Notes List -->
            <div class="w-full md:w-1/3 border-r border-slate-200 bg-slate-50/50 flex flex-col">
                <div class="p-4 border-b border-slate-200">
                    <div class="flex gap-2">
                        <div class="relative flex-1">
                            <i class="fa-solid fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
                            <input type="text" id="search-note" placeholder="Tìm kiếm ghi chú..." class="w-full pl-9 pr-3 py-2 bg-white border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-sm">
                        </div>
                        <button id="btn-toggle-view" class="bg-white border border-slate-300 text-slate-500 hover:text-slate-700 hover:bg-slate-50 px-3 py-2 rounded-lg transition-colors shadow-sm" title="Thu gọn / Mở rộng danh sách">
                            <i class="fa-solid fa-bars"></i>
                        </button>
                    </div>
                </div>
                <div id="notes-list" class="flex-1 overflow-y-auto p-2 custom-scrollbar">
                    <!-- Note items will be injected here -->
                    <div class="text-center text-slate-500 text-sm py-10" id="empty-state">
                        Chưa có ghi chú nào.<br>Hãy tạo ghi chú đầu tiên của bạn!
                    </div>
                </div>
            </div>

            <!-- Note Editor -->
            <div id="note-editor-container" class="flex-1 bg-white flex flex-col hidden relative">
                <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                    <input type="text" id="note-title-input" placeholder="Tiêu đề ghi chú..." class="text-xl font-bold bg-transparent outline-none flex-1 mr-4 placeholder-slate-400 text-slate-800">
                    <div class="flex gap-2">
                        <button id="btn-pin-note" class="p-2 text-slate-400 hover:text-yellow-600 hover:bg-yellow-50 rounded-lg transition-colors" title="Ghim ra Desktop (Cửa sổ nổi)">
                            <i class="fa-solid fa-up-right-from-square"></i>
                        </button>
                        <button id="btn-delete-note" class="p-2 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition-colors" title="Xóa ghi chú">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                        <button id="btn-save-note" class="bg-blue-100 text-blue-700 hover:bg-blue-200 px-4 py-1.5 rounded-lg transition-colors font-medium text-sm flex items-center gap-2">
                            <i class="fa-solid fa-check"></i> Lưu
                        </button>
                    </div>
                </div>

                <!-- AI Assistant Toolbar -->
                <div class="bg-indigo-50/60 px-4 py-2.5 flex flex-wrap gap-2 border-b border-indigo-100 items-center">
                    <span class="text-xs font-bold text-indigo-700 flex items-center mr-1">
                        <i class="fa-solid fa-sparkles mr-1.5 animate-pulse text-indigo-500"></i> AI Trợ lý:
                    </span>
                    <button id="btn-ai-improve" class="ai-btn text-xs bg-white border border-indigo-200 hover:bg-indigo-100 text-indigo-700 px-3 py-1.5 rounded-md transition-colors flex items-center gap-1.5 shadow-sm font-medium">
                        <i class="fa-solid fa-wand-magic-sparkles"></i> Làm mượt
                    </button>
                    <button id="btn-ai-summarize" class="ai-btn text-xs bg-white border border-indigo-200 hover:bg-indigo-100 text-indigo-700 px-3 py-1.5 rounded-md transition-colors flex items-center gap-1.5 shadow-sm font-medium">
                        <i class="fa-solid fa-compress"></i> Tóm tắt
                    </button>
                    <button id="btn-ai-todos" class="ai-btn text-xs bg-white border border-indigo-200 hover:bg-indigo-100 text-indigo-700 px-3 py-1.5 rounded-md transition-colors flex items-center gap-1.5 shadow-sm font-medium">
                        <i class="fa-solid fa-list-check"></i> Tạo To-do
                    </button>
                </div>

                <textarea id="note-content-input" placeholder="Viết nội dung ở đây..." class="flex-1 p-6 resize-none outline-none text-slate-700 leading-relaxed custom-scrollbar"></textarea>
                <div class="bg-slate-50 px-4 py-2 text-xs text-slate-400 border-t border-slate-100 text-right">
                    Lần sửa cuối: <span id="note-last-edited">Chưa lưu</span>
                </div>
            </div>
            
            <!-- Placeholder when no note selected -->
            <div id="no-note-selected" class="flex-1 bg-white flex flex-col items-center justify-center text-slate-400">
                <i class="fa-regular fa-note-sticky text-6xl mb-4 text-slate-200"></i>
                <p class="text-lg">Chọn một ghi chú để xem hoặc tạo mới</p>
            </div>
        </div>
    </main>

    <!-- Custom Notification Box (Instead of Alert) -->
    <div id="notification-box" class="fixed bottom-6 right-6 max-w-sm w-full bg-white rounded-xl shadow-2xl border-l-4 border-blue-500 p-4 flex gap-4 hidden z-50 transform transition-all duration-300">
        <div id="notif-icon" class="text-2xl mt-1">
            <!-- Icon injected via JS -->
        </div>
        <div class="flex-1">
            <h3 id="notif-title" class="font-bold text-slate-800 text-lg mb-1">Thông báo</h3>
            <p id="notif-message" class="text-slate-600 text-sm">Nội dung thông báo</p>
            <button id="btn-close-notif" class="mt-3 bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-1.5 rounded-lg text-sm font-medium transition-colors">Đã hiểu</button>
        </div>
    </div>

    <!-- Audio for alarm/timer (Using a base64 encoded simple beep to avoid external dependencies, but using a generic beep tone structure) -->
    <!-- Creating tone via Web Audio API in JS is more reliable than embedding base64 audio data directly in HTML for this setup -->

    <script type="module">
        // --- State Management ---
        let notes = JSON.parse(localStorage.getItem('local_notes')) || [];
        let currentNoteId = null;
        let isCompactView = false;
        let reminders = JSON.parse(localStorage.getItem('reminders')) || [];
        
        let timerInterval;
        let timerRemaining = 0;
        let isTimerRunning = false;

        // --- DOM Elements ---
        const els = {
            currentTime: document.getElementById('current-time'),
            timerMin: document.getElementById('timer-min'),
            timerSec: document.getElementById('timer-sec'),
            timerInputs: document.getElementById('timer-inputs'),
            timerDisplay: document.getElementById('timer-display'),
            btnStartTimer: document.getElementById('btn-start-timer'),
            btnStopTimer: document.getElementById('btn-stop-timer'),
            btnResetTimer: document.getElementById('btn-reset-timer'),
            reminderText: document.getElementById('reminder-text'),
            reminderTime: document.getElementById('reminder-time'),
            btnSetReminder: document.getElementById('btn-set-reminder'),
            activeRemindersList: document.getElementById('active-reminders-list'),
            notesList: document.getElementById('notes-list'),
            emptyState: document.getElementById('empty-state'),
            btnNewNote: document.getElementById('btn-new-note'),
            searchNote: document.getElementById('search-note'),
            btnToggleView: document.getElementById('btn-toggle-view'),
            editorContainer: document.getElementById('note-editor-container'),
            noNoteSelected: document.getElementById('no-note-selected'),
            titleInput: document.getElementById('note-title-input'),
            contentInput: document.getElementById('note-content-input'),
            btnSaveNote: document.getElementById('btn-save-note'),
            btnDeleteNote: document.getElementById('btn-delete-note'),
            btnPinNote: document.getElementById('btn-pin-note'),
            lastEdited: document.getElementById('note-last-edited'),
            notifBox: document.getElementById('notification-box'),
            notifTitle: document.getElementById('notif-title'),
            notifMessage: document.getElementById('notif-message'),
            notifIcon: document.getElementById('notif-icon'),
            btnCloseNotif: document.getElementById('btn-close-notif'),
            
            // AI Buttons
            btnAiImprove: document.getElementById('btn-ai-improve'),
            btnAiSummarize: document.getElementById('btn-ai-summarize'),
            btnAiTodos: document.getElementById('btn-ai-todos')
        };

        // --- Utilities ---
        const generateId = () => Date.now().toString(36) + Math.random().toString(36).substring(2);
        const formatDate = (date) => new Date(date).toLocaleString('vi-VN', { hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit', year: 'numeric' });
        const padZero = (num) => num.toString().padStart(2, '0');

        function saveNotesToLocal() {
            localStorage.setItem('local_notes', JSON.stringify(notes));
        }

        function showNotification(title, message, type = 'info') {
            els.notifTitle.textContent = title;
            els.notifMessage.textContent = message;
            
            els.notifBox.className = 'fixed bottom-6 right-6 max-w-sm w-full bg-white rounded-xl shadow-2xl border-l-4 p-4 flex gap-4 z-50 transform transition-all duration-300 notification-anim';
            
            if (type === 'timer') {
                els.notifBox.classList.add('border-orange-500');
                els.notifIcon.innerHTML = '<i class="fa-solid fa-hourglass-end text-orange-500"></i>';
                playAlertSound();
            } else if (type === 'alarm') {
                els.notifBox.classList.add('border-yellow-500');
                els.notifIcon.innerHTML = '<i class="fa-solid fa-bell-ringing text-yellow-500 animate-bounce"></i>';
                playAlertSound();
            } else if (type === 'success') {
                els.notifBox.classList.add('border-green-500');
                els.notifIcon.innerHTML = '<i class="fa-solid fa-circle-check text-green-500"></i>';
            } else if (type === 'error') {
                els.notifBox.classList.add('border-red-500');
                els.notifIcon.innerHTML = '<i class="fa-solid fa-circle-exclamation text-red-500"></i>';
            } else {
                els.notifBox.classList.add('border-blue-500');
                els.notifIcon.innerHTML = '<i class="fa-solid fa-circle-info text-blue-500"></i>';
            }
        }

        els.btnCloseNotif.addEventListener('click', () => {
            els.notifBox.classList.add('hidden');
            els.notifBox.classList.remove('notification-anim');
        });

        let audioCtx;
        function playAlertSound() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            let time = audioCtx.currentTime;
            for(let i=0; i<3; i++) {
                let osc = audioCtx.createOscillator();
                let gainNode = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(800, time);
                gainNode.gain.setValueAtTime(0.1, time);
                gainNode.gain.exponentialRampToValueAtTime(0.01, time + 0.1);
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                osc.start(time);
                osc.stop(time + 0.1);
                time += 0.25;
            }
        }

        function updateClock() {
            const now = new Date();
            els.currentTime.textContent = `${padZero(now.getHours())}:${padZero(now.getMinutes())}:${padZero(now.getSeconds())}`;
            checkReminders(now);
            requestAnimationFrame(updateClock);
        }
        requestAnimationFrame(updateClock);

        function updateTimerDisplay() {
            const m = Math.floor(timerRemaining / 60);
            const s = timerRemaining % 60;
            els.timerDisplay.textContent = `${padZero(m)}:${padZero(s)}`;
        }

        function startTimer() {
            if(isTimerRunning) return;
            const m = parseInt(els.timerMin.value) || 0;
            const s = parseInt(els.timerSec.value) || 0;
            timerRemaining = m * 60 + s;
            if(timerRemaining <= 0) return;

            isTimerRunning = true;
            els.timerInputs.classList.add('hidden');
            els.timerDisplay.classList.remove('hidden');
            els.btnStartTimer.classList.add('hidden');
            els.btnStopTimer.classList.remove('hidden');
            updateTimerDisplay();

            timerInterval = setInterval(() => {
                timerRemaining--;
                updateTimerDisplay();
                if (timerRemaining <= 0) {
                    stopTimer();
                    showNotification("Hết giờ đếm ngược!", "Đã hết thời gian bạn cài đặt.", "timer");
                }
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
            isTimerRunning = false;
            els.btnStartTimer.classList.remove('hidden');
            els.btnStopTimer.classList.add('hidden');
        }

        function resetTimer() {
            stopTimer();
            els.timerInputs.classList.remove('hidden');
            els.timerDisplay.classList.add('hidden');
            timerRemaining = 0;
        }

        els.btnStartTimer.addEventListener('click', startTimer);
        els.btnStopTimer.addEventListener('click', stopTimer);
        els.btnResetTimer.addEventListener('click', resetTimer);

        function renderReminders() {
            els.activeRemindersList.innerHTML = '';
            reminders.forEach((reminder) => {
                const div = document.createElement('div');
                div.className = 'flex justify-between items-center bg-slate-50 p-3 rounded-lg border border-slate-100 text-sm shadow-sm';
                
                // Hiển thị thêm icon lấp lánh nếu báo thức được tạo tự động từ nội dung
                const autoIcon = reminder.isAuto ? '<i class="fa-solid fa-wand-magic-sparkles text-indigo-400 ml-2" title="Tạo tự động từ ghi chú"></i>' : '';

                div.innerHTML = `
                    <div class="flex-1 overflow-hidden pr-2">
                        <div class="font-bold text-slate-800 truncate flex items-center">${reminder.text} ${autoIcon}</div>
                        <div class="font-mono text-xs text-rose-500 mt-1"><i class="fa-regular fa-clock"></i> ${reminder.time}</div>
                    </div>
                    <button class="text-slate-400 hover:text-red-500 transition-colors btn-delete-reminder p-2" data-id="${reminder.id}" title="Xóa nhắc nhở">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                `;
                els.activeRemindersList.appendChild(div);
            });
            
            // Gắn event listener cho nút xóa
            document.querySelectorAll('.btn-delete-reminder').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = e.currentTarget.getAttribute('data-id');
                    deleteReminder(id);
                });
            });
            localStorage.setItem('reminders', JSON.stringify(reminders));
        }

        // Hàm phân tích giờ thông minh (vd: 7 -> 07:00, 19 -> 19:00, 7:30 -> 07:30)
        function parseTimeInput(input) {
            input = input.trim();
            if (!input) return null;
            
            let hours, minutes;
            if (input.includes(':')) {
                const parts = input.split(':');
                hours = parseInt(parts[0]);
                minutes = parseInt(parts[1]);
            } else {
                const num = parseInt(input);
                if (isNaN(num)) return null;
                if (num < 24) { // Gõ 7, 19...
                    hours = num;
                    minutes = 0;
                } else if (input.length === 3 || input.length === 4) { // Gõ 730, 1945...
                    minutes = parseInt(input.slice(-2));
                    hours = parseInt(input.slice(0, -2));
                } else {
                    return null;
                }
            }
            
            if (isNaN(hours) || isNaN(minutes) || hours < 0 || hours > 23 || minutes < 0 || minutes > 59) {
                return null;
            }
            return `${padZero(hours)}:${padZero(minutes)}`;
        }

        function setReminder() {
            // Lấy giá trị trực tiếp từ ô input time (trình duyệt tự định dạng HH:MM)
            const timeVal = els.reminderTime.value;
            const textVal = els.reminderText.value.trim() || 'Có lời nhắc công việc!';
            
            if(!timeVal) {
                showNotification("Chưa chọn giờ", "Vui lòng chọn thời gian để nhắc nhở.", "error");
                return;
            }

            const newReminder = { id: generateId(), text: textVal, time: timeVal, triggered: false };
            reminders.push(newReminder);
            reminders.sort((a, b) => a.time.localeCompare(b.time));
            renderReminders();
            
            els.reminderText.value = '';
            els.reminderTime.value = '';
            showNotification("Đã tạo nhắc nhở", `Sẽ nhắc nhở lúc ${timeVal}`, "success");
        }

        function deleteReminder(id) {
            reminders = reminders.filter(a => a.id !== id);
            renderReminders();
        }

        function checkReminders(now) {
            const currentTimeStr = `${padZero(now.getHours())}:${padZero(now.getMinutes())}`;
            reminders.forEach(reminder => {
                if (reminder.time === currentTimeStr && !reminder.triggered) {
                    reminder.triggered = true;
                    showNotification("⏰ Nhắc nhở:", reminder.text, "alarm");
                } else if (reminder.time !== currentTimeStr) {
                    reminder.triggered = false; // Reset cho ngày hôm sau
                }
            });
        }

        els.btnSetReminder.addEventListener('click', setReminder);

        function renderNotesList(filterText = '') {
            els.notesList.innerHTML = '';
            let filteredNotes = notes.filter(note => 
                (note.title || '').toLowerCase().includes(filterText.toLowerCase()) || 
                (note.content || '').toLowerCase().includes(filterText.toLowerCase())
            );

            if (filteredNotes.length === 0) {
                els.emptyState.style.display = 'block';
                if(filterText) els.emptyState.innerHTML = "Không tìm thấy ghi chú nào.";
                else els.emptyState.innerHTML = "Chưa có ghi chú nào.<br>Hãy tạo ghi chú đầu tiên của bạn!";
                els.notesList.appendChild(els.emptyState);
            } else {
                els.emptyState.style.display = 'none';
                filteredNotes.forEach(note => {
                    const div = document.createElement('div');
                    const title = (note.title || '').trim() === '' ? 'Không có tiêu đề' : note.title;
                    
                    if (isCompactView) {
                        div.className = `p-2.5 mb-1.5 rounded-lg cursor-pointer border transition-all flex justify-between items-center gap-2 ${note.id === currentNoteId ? 'bg-blue-50 border-blue-200 shadow-sm' : 'bg-white border-transparent hover:bg-slate-100'}`;
                        const shortDate = formatDate(note.updatedAt).split(' ')[0] || ''; 
                        
                        div.innerHTML = `
                            <h4 class="font-semibold text-slate-800 text-sm truncate flex-1">${title}</h4>
                            <div class="text-[10px] text-slate-400 whitespace-nowrap">${shortDate}</div>
                        `;
                    } else {
                        div.className = `p-3 mb-2 rounded-lg cursor-pointer border transition-all ${note.id === currentNoteId ? 'bg-blue-50 border-blue-200 shadow-sm' : 'bg-white border-transparent hover:bg-slate-100'}`;
                        const preview = (note.content || '').trim() === '' ? 'Không có nội dung' : note.content.substring(0, 40) + (note.content.length > 40 ? '...' : '');
                        
                        div.innerHTML = `
                            <h4 class="font-semibold text-slate-800 text-sm truncate mb-1">${title}</h4>
                            <p class="text-xs text-slate-500 truncate mb-2">${preview}</p>
                            <div class="text-[10px] text-slate-400 text-right">${formatDate(note.updatedAt)}</div>
                        `;
                    }
                    
                    div.addEventListener('click', () => selectNote(note.id));
                    els.notesList.appendChild(div);
                });
            }
        }

        function selectNote(id) {
            currentNoteId = id;
            const note = notes.find(n => n.id === id);
            
            if (note) {
                els.titleInput.value = note.title || '';
                els.contentInput.value = note.content || '';
                els.lastEdited.textContent = formatDate(note.updatedAt);
                
                els.noNoteSelected.classList.add('hidden');
                els.editorContainer.classList.remove('hidden');
                els.editorContainer.classList.add('flex');
                
                renderNotesList(els.searchNote.value);
            }
        }

        async function createNewNote() {
            const newNoteId = generateId();
            const newNote = {
                id: newNoteId,
                title: '',
                content: '',
                createdAt: Date.now(),
                updatedAt: Date.now()
            };
            
            notes.unshift(newNote);
            saveNotesToLocal();
            
            selectNote(newNoteId);
            els.titleInput.focus();
        }

        // Hàm Tự động Quét và Trích xuất giờ từ nội dung
        function extractTimeFromContent(noteId, text) {
            // Xóa các nhắc nhở tự động cũ của ghi chú này để tránh trùng lặp khi gõ
            reminders = reminders.filter(r => !(r.isAuto && r.noteId === noteId));
            
            if (!text) {
                renderReminders();
                return;
            }

            const lines = text.split('\n');
            // Regex hỗ trợ các định dạng: 10h, 10g, 10:30, 10h30, 10g30
            const timeRegex = /\b([0-1]?[0-9]|2[0-3])(?:h|g|:)([0-5][0-9])?\b/i;
            let added = false;

            lines.forEach(line => {
                const match = line.match(timeRegex);
                if (match) {
                    let hour = parseInt(match[1]);
                    let minute = match[2] ? parseInt(match[2]) : 0;
                    const timeStr = `${padZero(hour)}:${padZero(minute)}`;
                    
                    reminders.push({
                        id: generateId(),
                        text: line.trim(),
                        time: timeStr,
                        triggered: false,
                        isAuto: true,
                        noteId: noteId
                    });
                    added = true;
                }
            });

            if (added) {
                reminders.sort((a, b) => a.time.localeCompare(b.time));
            }
            renderReminders();
        }

        async function saveCurrentNote() {
            if (!currentNoteId) return;
            
            const index = notes.findIndex(n => n.id === currentNoteId);
            if (index !== -1) {
                notes[index].title = els.titleInput.value;
                notes[index].content = els.contentInput.value;
                notes[index].updatedAt = Date.now();
                
                // Kích hoạt trích xuất giờ tự động
                extractTimeFromContent(currentNoteId, notes[index].content);
                
                els.lastEdited.textContent = formatDate(notes[index].updatedAt);
                renderNotesList(els.searchNote.value);
                saveNotesToLocal();
                
                const originalText = els.btnSaveNote.innerHTML;
                els.btnSaveNote.innerHTML = '<i class="fa-solid fa-check-double"></i> Đã lưu';
                els.btnSaveNote.classList.replace('bg-blue-100', 'bg-green-100');
                els.btnSaveNote.classList.replace('text-blue-700', 'text-green-700');
                
                setTimeout(() => {
                    els.btnSaveNote.innerHTML = originalText;
                    els.btnSaveNote.classList.replace('bg-green-100', 'bg-blue-100');
                    els.btnSaveNote.classList.replace('text-green-700', 'text-blue-700');
                }, 2000);
            }
        }

        async function deleteCurrentNote() {
            if (!currentNoteId) return;
            
            const idToDelete = currentNoteId;
            currentNoteId = null;
            
            els.editorContainer.classList.add('hidden');
            els.editorContainer.classList.remove('flex');
            els.noNoteSelected.classList.remove('hidden');
            
            notes = notes.filter(n => n.id !== idToDelete);
            
            // Xóa các báo thức tự động được tạo từ ghi chú này
            reminders = reminders.filter(r => !(r.isAuto && r.noteId === idToDelete));
            renderReminders();

            saveNotesToLocal();
            renderNotesList(els.searchNote.value);
            showNotification("Đã xóa", "Ghi chú đã được xóa thành công.", "info");
        }

        // Tính năng Ghim Note ra Desktop (Mở cửa sổ nổi)
        async function pinNoteToDesktop() {
            if (!currentNoteId) return;
            
            const title = els.titleInput.value || 'Ghi chú';
            const content = els.contentInput.value || '';
            
            const injectHTML = `
                <title>${title}</title>
                <style>
                    :root {
                        --note-bg: #fef3c7; /* Màu giấy note vàng */
                        --note-header: #fde68a;
                        --text-color: #334155;
                    }
                    body { 
                        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
                        background-color: var(--note-bg); 
                        color: var(--text-color); 
                        margin: 0; padding: 0; 
                        height: 100vh; 
                        display: flex; flex-direction: column; 
                        overflow: hidden;
                    }
                    .header {
                        background-color: var(--note-header);
                        padding: 10px 16px;
                        font-weight: 600;
                        font-size: 14px;
                        display: flex;
                        align-items: center;
                        gap: 8px;
                        box-shadow: 0 1px 2px rgba(0,0,0,0.05);
                        -webkit-app-region: drag; /* Hỗ trợ kéo thả trên một số HĐH */
                        user-select: none;
                    }
                    .content { 
                        padding: 20px; 
                        flex: 1; 
                        overflow-y: auto; 
                        font-size: 15px; 
                        line-height: 1.6; 
                        white-space: pre-wrap; 
                    }
                    ::-webkit-scrollbar { width: 6px; }
                    ::-webkit-scrollbar-track { background: transparent; }
                    ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 4px; }
                    ::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.25); }
                </style>
            `;

            // HTML của nội dung tờ Note
            // Escape các ký tự HTML đặc biệt để tránh lỗi hiển thị nếu có thẻ HTML trong note
            const safeContent = content.replace(/</g, "&lt;").replace(/>/g, "&gt;");
            const noteBody = `
                <div class="header">
                    <span>📌</span> ${title}
                </div>
                <div class="content">${safeContent}</div>
            `;
            
            if ('documentPictureInPicture' in window) {
                try {
                    const pipWindow = await window.documentPictureInPicture.requestWindow({
                        width: 340,
                        height: 380,
                    });
                    
                    pipWindow.document.head.innerHTML = injectHTML;
                    pipWindow.document.body.innerHTML = noteBody;
                    
                    showNotification("Đã ghim (PiP)", "Ghi chú nổi Luôn ở trên cùng (Always on top).", "success");
                    return;
                } catch (e) {
                    console.log("Tính năng PiP bị hủy hoặc lỗi, chuyển sang Pop-up:", e);
                }
            }

            const features = 'popup=yes,width=340,height=380,resizable=yes,scrollbars=yes';
            const stickyWin = window.open('', '_blank', features);
            
            if (!stickyWin) {
                showNotification("Đã bị chặn Pop-up", "Vui lòng cho phép trang web này mở Pop-up ở thanh địa chỉ để dùng tính năng ghim.", "error");
                return;
            }
            
            stickyWin.document.write(`
                <!DOCTYPE html>
                <html>
                <head>
                    ${injectHTML}
                </head>
                <body>
                    ${noteBody}
                </body>
                </html>
            `);
            stickyWin.document.close();
            showNotification("Đã ghim", "Ghi chú đã được ghim thành một cửa sổ rời.", "success");
        }

        els.btnNewNote.addEventListener('click', createNewNote);
        els.btnSaveNote.addEventListener('click', saveCurrentNote);
        els.btnDeleteNote.addEventListener('click', deleteCurrentNote);
        els.btnPinNote.addEventListener('click', pinNoteToDesktop);
        
        els.btnToggleView.addEventListener('click', () => {
            isCompactView = !isCompactView;
            els.btnToggleView.innerHTML = isCompactView ? '<i class="fa-solid fa-list"></i>' : '<i class="fa-solid fa-bars"></i>';
            renderNotesList(els.searchNote.value);
        });

        els.searchNote.addEventListener('input', (e) => {
            renderNotesList(e.target.value);
        });

        // Tính năng Tự động lưu (Auto-save) sau 1 giây không gõ
        let autoSaveTimeout;
        const handleInput = () => {
            clearTimeout(autoSaveTimeout);
            autoSaveTimeout = setTimeout(saveCurrentNote, 1000); 
        };
        els.titleInput.addEventListener('input', handleInput);
        els.contentInput.addEventListener('input', handleInput);

        async function callGemini(prompt, systemInstruction, retries = 3) {
            const apiKey = ""; // Canvas framework tự động chèn API Key khi rỗng
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
            
            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                systemInstruction: { parts: [{ text: systemInstruction }] }
            };

            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    
                    if (!response.ok) {
                        if (response.status === 429 && i < retries - 1) {
                            // Exponential backoff để tránh bị chặn do gọi nhiều
                            const delay = Math.pow(2, i + 1) * 1000;
                            await new Promise(resolve => setTimeout(resolve, delay));
                            continue;
                        }
                        throw new Error(`API error: ${response.status}`);
                    }
                    
                    const result = await response.json();
                    const text = result.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (!text) throw new Error("Không có phản hồi từ AI");
                    return text;
                } catch (error) {
                    if (i === retries - 1) throw error;
                }
            }
        }

        async function processAIAction(button, actionType) {
            const currentText = els.contentInput.value.trim();
            if (!currentText) {
                showNotification("Chưa có nội dung", "Vui lòng viết gì đó vào ghi chú trước khi sử dụng AI Trợ lý.", "info");
                return;
            }

            const originalHtml = button.innerHTML;
            button.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đang phân tích...';
            
            // Disable all AI buttons while processing
            const aiButtons = document.querySelectorAll('.ai-btn');
            aiButtons.forEach(btn => {
                btn.disabled = true;
                btn.classList.add('opacity-50', 'cursor-not-allowed');
            });

            let systemPrompt = "";
            let userPrompt = currentText;
            let appendMode = false;

            switch (actionType) {
                case 'improve':
                    systemPrompt = "Bạn là một trợ lý viết lách chuyên nghiệp. Hãy sửa lỗi chính tả, cải thiện ngữ pháp và văn phong của đoạn văn bản sau sao cho lưu loát, chuyên nghiệp và mượt mà hơn. Giữ nguyên ý nghĩa gốc và cấu trúc dòng. CHỈ TRẢ VỀ kết quả văn bản đã sửa đổi, không thêm lời chào, không giải thích gì thêm.";
                    break;
                case 'summarize':
                    systemPrompt = "Bạn là một chuyên gia tóm tắt dữ liệu. Hãy tóm tắt lại văn bản sau một cách ngắn gọn, súc tích, giữ lại các ý chính quan trọng nhất. Trình bày dễ đọc. CHỈ TRẢ VỀ phần tóm tắt, không thêm bất kỳ văn bản nào khác.";
                    break;
                case 'todos':
                    systemPrompt = "Bạn là một quản lý dự án xuất sắc. Hãy đọc văn bản sau và trích xuất tất cả các công việc, nhiệm vụ hoặc hành động ẩn chứa trong đó. Trình bày dưới dạng danh sách gạch đầu dòng (to-do list). CHỈ TRẢ VỀ danh sách gạch đầu dòng, không thêm lời giải thích.";
                    appendMode = true;
                    break;
            }

            try {
                const resultText = await callGemini(userPrompt, systemPrompt);
                
                if (appendMode) {
                    els.contentInput.value += (els.contentInput.value.endsWith('\n') ? '\n' : '\n\n') + "--- (AI Gợi ý) ---\n" + resultText + "\n";
                } else {
                    els.contentInput.value = resultText;
                }
                
                // Cập nhật lại độ cao của textarea và kích hoạt auto-save đám mây
                handleInput();
                showNotification("Thành công", "AI đã hoàn tất yêu cầu của bạn.", "success");
            } catch (error) {
                console.error(error);
                showNotification("Lỗi AI", "Không thể kết nối hoặc AI đang quá tải. Vui lòng thử lại sau.", "error");
            } finally {
                // Khôi phục nút
                button.innerHTML = originalHtml;
                aiButtons.forEach(btn => {
                    btn.disabled = false;
                    btn.classList.remove('opacity-50', 'cursor-not-allowed');
                });
            }
        }

        // Gắn sự kiện cho các nút AI
        els.btnAiImprove.addEventListener('click', (e) => processAIAction(e.currentTarget, 'improve'));
        els.btnAiSummarize.addEventListener('click', (e) => processAIAction(e.currentTarget, 'summarize'));
        els.btnAiTodos.addEventListener('click', (e) => processAIAction(e.currentTarget, 'todos'));

        function init() {
            renderReminders();
            renderNotesList();
        }
        init();
    </script>
</body>
